apiVersion: v1
kind: Namespace
metadata:
  name: ai-production
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: ai-production
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: ai-production
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-deployment
  namespace: ai-production
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              value: "postgres"
            - name: POSTGRES_DB
              value: "rag_db"
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: pgdata
      volumes:
        - name: pgdata
          persistentVolumeClaim:
            claimName: postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: ai-rag-backend-svc
  namespace: ai-production
spec:
  ports:
    - port: 8000
      targetPort: 8000
  selector:
    app: fastapi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi-deployment
  namespace: ai-production
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fastapi
  template:
    metadata:
      labels:
        app: fastapi
    spec:
      containers:
        - name: fastapi
          image: your-fastapi-backend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              value: "postgresql://postgres:postgres@postgres-service:5432/rag_db"
---
apiVersion: v1
kind: Service
metadata:
  name: nextjs-service
  namespace: ai-production
spec:
  ports:
    - port: 3000
      targetPort: 3000
  selector:
    app: nextjs
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextjs-deployment
  namespace: ai-production
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nextjs
  template:
    metadata:
      labels:
        app: nextjs
    spec:
      containers:
        - name: nextjs
          image: your-nextjs-frontend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          env:
            - name: BACKEND_URL
              value: "http://ai-rag-backend-svc:8000"
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-ingress
  namespace: ai-production
spec:
  ingressClassName: nginx
  rules:
    - host: ai.enterprise.internal
      http:
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: nextjs-service
              port:
                number: 3000
        - path: /api/v1
          pathType: Prefix
          backend:
            service:
              name: ai-rag-backend-svc
              port:
                number: 8000