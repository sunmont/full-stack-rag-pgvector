apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-rag-backend
  namespace: ai-production
  labels:
    app: ai-rag-backend
spec:
  replicas: 3 # Horizontal autoscaling target
  selector:
    matchLabels:
      app: ai-rag-backend
  template:
    metadata:
      labels:
        app: ai-rag-backend
    spec:
      containers:
      - name: backend
        image: your-docker-registry/ai-rag-backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: connection-string
        - name: REDIS_URL
          value: "redis://redis-master.ai-production.svc.cluster.local:6379"
        resources:
          limits:
            cpu: "2"
            memory: "4Gi"
          requests:
            cpu: "500m"
            memory: "1Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ai-rag-backend-svc
  namespace: ai-production
spec:
  selector:
    app: ai-rag-backend
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8000
  type: ClusterIP