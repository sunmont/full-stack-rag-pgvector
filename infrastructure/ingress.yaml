apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-ingress
  namespace: ai-production
  annotations:
    kubernetes.io/ingress.class: "nginx"
spec:
  rules:
  - host: ai.enterprise.internal
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ai-rag-backend-svc
            port:
              number: 80